name: Alpha
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Terminal dependency (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Terminal dependency (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build:host
      - name: Packaged Host acceptance
        run: |
          bun build --compile --outfile /tmp/weave-agent product/portal/src/test-fixtures/fake-agent.ts
          bun run test:host:packaged product/portal/dist/weave-portal /tmp/weave-agent
      - name: Package desktop
        if: runner.os == 'macOS'
        run: bun run build:desktop
      - name: Retain packaged Host artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: host-${{ runner.os }}-${{ runner.arch }}
          path: product/portal/dist/weave-portal*
