name: Alpha
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install pinned Zig
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, platform, subprocess, urllib.request
          pin = json.loads(pathlib.Path('product/alpha/native/ghostty/pin.json').read_text())
          arch = {'arm64': 'aarch64', 'aarch64': 'aarch64', 'x86_64': 'x86_64'}[platform.machine()]
          system = {'Darwin': 'macos', 'Linux': 'linux'}[platform.system()]
          with urllib.request.urlopen('https://ziglang.org/download/index.json') as response:
              package = json.load(response)[pin['zig']][f'{arch}-{system}']
          with urllib.request.urlopen(package['tarball']) as response:
              archive = response.read()
          if hashlib.sha256(archive).hexdigest() != package['shasum']:
              raise SystemExit('Zig archive checksum mismatch')
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'weave-zig'
          destination.mkdir()
          tarball = destination / 'zig.tar.xz'
          tarball.write_bytes(archive)
          subprocess.run(['tar', '-xJf', str(tarball), '-C', str(destination), '--strip-components=1'], check=True)
          with open(os.environ['GITHUB_PATH'], 'a') as path:
              path.write(str(destination) + '\n')
          subprocess.run([str(destination / 'zig'), 'version'], check=True)
          PYTHON
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build:host
      - run: bun run test:terminal-service
      - name: Packaged Host acceptance
        run: |
          bun build --compile --outfile /tmp/weave-agent product/portal/src/test-fixtures/fake-agent.ts
          bun run test:host:packaged product/portal/dist/weave-portal /tmp/weave-agent
      - name: Package desktop
        if: runner.os == 'macOS'
        run: bun run build:desktop
      - name: Retain packaged Host artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: host-${{ runner.os }}-${{ runner.arch }}
          path: |
            product/portal/dist/weave-portal
            product/portal/dist/weave-portal.json
            product/portal/dist/weave-terminal-service
            product/portal/dist/terminal-vt.node
