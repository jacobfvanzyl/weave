name: Desktop full-stack acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-full-stack-acceptance.yml"
      - "desktop/**"
      - "packages/client/**"
      - "packages/protocol/**"
      - "portal/**"
      - "server/**"
      - "bun.lock"
      - "package.json"
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - run: bun install --frozen-lockfile
      - run: xvfb-run --auto-servernum bun --filter weave-desktop test:acceptance
