# The weave app's shell on the Mac (ADR 0032, WVE-204): Tauri around the same React the iPad and
# iPhone run in Capacitor. Its Rust core reaches this Mac's Host and the Dispatcher with
# `weave-host-client` and relays each connection to the page.
#
# It's kept out of the repository's Cargo workspace, with its own lockfile and `target/`, so
# Tauri's dependencies don't join the workspace's build. It takes the workspace's toolchain
# (`rust-toolchain.toml`) and clippy settings (`clippy.toml`) from the directories above it, and
# its lint set, copied below.

[package]
name = "weave-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[lib]
name = "weave_app"

[[bin]]
name = "weave-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
agent-client-protocol = "=3.0.0"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-notification = "=2.8.0"
tauri-plugin-opener = "=2.7.2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false }
tracing = "0.1"
weave-host-client = { path = "../../host-client" }
weave-host-protocol = { path = "../../protocol" }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

# The workspace's, as in its Cargo.toml (which mirrors codex-rs).
[lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
disallowed_methods = "deny"
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"
