[package]
name = "weave-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "weave"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
weave-acp-core = { workspace = true }
weave-agents = { workspace = true }
weave-host = { workspace = true }
weave-host-client = { workspace = true }
weave-host-protocol = { workspace = true }
weave-tui = { workspace = true }
agent-client-protocol = { workspace = true }
anyhow = { workspace = true }
qrcode = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-std", "macros", "net", "rt-multi-thread", "signal", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
weave-fake-agent = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
