[package]
name = "weave-dispatcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "weave_dispatcher"

[lints]
workspace = true

[dependencies]
weave-host-client = { workspace = true }
weave-host-protocol = { workspace = true }
agent-client-protocol = { workspace = true }
base64 = { workspace = true }
croner = { workspace = true }
getrandom = { workspace = true }
jiff = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
weave-acp-core = { workspace = true }
weave-agents = { workspace = true }
weave-fake-agent = { workspace = true }
weave-host = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
