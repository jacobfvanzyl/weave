[package]
name = "weave-holder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "weave_holder"

[[bin]]
name = "weave-holder"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Regenerate src/ffi/bindings.rs from libghostty-vt's headers after moving the pin in
# ghostty.toml; needs libclang. Without it the committed bindings are used.
bindgen = ["dep:bindgen"]

[dependencies]
libc = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
bindgen = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
toml = { workspace = true }
