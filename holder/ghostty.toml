# The Ghostty commit weave builds libghostty-vt from, and the Zig that builds it (ADR 0022).
# weave-holder and the app's terminals must decode each other's snapshots, so both build from
# this pin. Moving it changes the codec every holder and client reports.

[ghostty]
repository = "https://github.com/ghostty-org/ghostty"
commit = "fb13fa9602f47590ccfaaea4cd8e178fac2ec8cc" # main, 2026-10-25

