[package]
name = "weave-host-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "weave_host_client"

[lints]
workspace = true

[dependencies]
weave-host-protocol = { workspace = true }
agent-client-protocol = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
p256 = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-native-roots"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

# The Secure Enclave, on the Mac and on the iPad and iPhone, whose app's core is this crate
# (WVE-221).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
core-foundation = { workspace = true }
security-framework = { workspace = true }
security-framework-sys = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

# The iPad and iPhone give a program no list of the system's roots, so there it trusts Mozilla's.
[target.'cfg(target_os = "ios")'.dependencies]
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
