[package]
name = "weave-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "weave_host"

[lints]
workspace = true

[dependencies]
weave-acp-core = { workspace = true }
weave-agents = { workspace = true }
weave-host-protocol = { workspace = true }
agent-client-protocol = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
p256 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
weave-fake-agent = { workspace = true }
weave-host-client = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }
