services:
  postgres:
    image: supabase/postgres:17.6.1.142
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "cron.database_name=weave"]
    environment:
      POSTGRES_DB: weave
      POSTGRES_PASSWORD: weave
    volumes:
      - weave-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weave"]
      interval: 10s
      timeout: 5s
      retries: 5

  weave-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4111:4111"
      - "4112:4112"
    volumes:
      - weave-attachments:/app/server/.data/attachments
    environment:
      NODE_ENV: production
      PORT: 4111
      WEAVE_PORTAL_WS_PORT: 4112
      # Canonical app database. DBOS defaults to this URL when enabled.
      WEAVE_DATABASE_URL: postgres://supabase_admin:weave@postgres:5432/weave
      WEAVE_DBOS_ENABLED: "1"
      # Optional override if DBOS should use a different system database.
      # DBOS_SYSTEM_DATABASE_URL: postgres://supabase_admin:weave@postgres:5432/weave
      WEAVE_ATTACHMENTS_DIR: /app/server/.data/attachments
      # Required single-owner auth. Prefer Dokploy environment variables/secrets over committing values.
      # WEAVE_OWNER_TOKEN: change-me
      # WEAVE_OWNER_ID: local-user
      # WEAVE_OWNER_NAME: Local User
      # Model config lives on server only.
      # WEAVE_DEFAULT_MODEL: openai/gpt-5.5
      # WEAVE_MODEL_OPTIONS: '[{"id":"openai/gpt-5.5","label":"GPT 5.5"}]'
      # Provider keys, if used by configured models/tools.
      # OPENAI_API_KEY: ...
      # ANTHROPIC_API_KEY: ...
      # EXA_API_KEY: ...

volumes:
  weave-postgres:
  weave-attachments:
