[workspace]
members = ["crates/acp-core", "crates/cli", "crates/fake-agent", "crates/tui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
weave-acp-core = { path = "crates/acp-core" }
weave-fake-agent = { path = "crates/fake-agent" }
weave-tui = { path = "crates/tui" }

agent-client-protocol = { version = "=3.0.0", features = ["process"] }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
diffy = "0.4.2"
futures = "0.3"
# Codex's file search: ripgrep's walker and nucleo's fuzzy matcher.
ignore = "0.4.23"
insta = "1.46.3"
nucleo-matcher = "0.3"
libc = "0.2"
pretty_assertions = "1"
pulldown-cmark = { version = "0.10", default-features = false }
regex-lite = "0.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "underline-color"] }
serde = "1"
serde_json = "1"
# Codex's syntax highlighting: syntect with two-face's grammars and themes.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "plist-load", "regex-onig"] }
tempfile = "3"
thiserror = "2"
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
two-face = { version = "0.5.1", default-features = false, features = ["syntect-onig"] }
toml = "0.9"
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
vt100 = "0.16.2"

[workspace.lints]
rust = {}

# Mirrors codex-rs/Cargo.toml.
[workspace.lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
disallowed_methods = "deny"
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"
